name: Release

on:
  push:
    tags: ['v*']

# Least privilege by default: guard/cabi/wheels only build and upload artifacts.
# The publish job widens its own scope to cut the release.
permissions:
  contents: read

jobs:
  guard:
    name: Tag matches .nimble version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      # A tag disagreeing with the package version ships artifacts whose
      # embedded version lies. Refuse before anything is built.
      - run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version' UniGlyph.nimble | cut -d'"' -f2)
          declared_py=$(grep -m1 '^version = ' py/pyproject.toml | cut -d'"' -f2)
          declared_h=$(grep -m1 -E '^#define [A-Z_]+_VERSION "' include/UniGlyph.h | cut -d'"' -f2)
          echo "tag=$tag nimble=$declared python=$declared_py header=$declared_h"
          test "$tag" = "$declared"
          test "$tag" = "$declared_py"
          test "$tag" = "$declared_h"

  test:
    name: Nim tests (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      - run: nimble testCi
      - run: nimble testCiRelease

  cabi:
    name: C ABI (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      - run: nimble clibStatic
      - run: nimble clib
      # gcc arrives with Nim's MinGW, GNU make does not ship on the runner image.
      - name: Install GNU make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress
      # Run the documented C ABI suite before packaging: a failing test must
      # abort the release rather than ship a broken artifact.
      - run: nimble ctest
      - name: Package
        shell: bash
        run: |
          set -eu
          dir="UniGlyph-${GITHUB_REF_NAME}-${{ matrix.os }}"
          mkdir -p "$dir/include"
          cp include/UniGlyph.h "$dir/include/"
          cp libUniGlyph.* "$dir/"
          cp LICENSE NOTICE "$dir/" 2>/dev/null || cp LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cabi-${{ matrix.os }}
          path: '*.tar.gz'

  wheels:
    name: Wheel (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -U setuptools wheel Cython pytest
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - run: nimble pyLib
      # Build the extension in-place and run the pytest suite before the
      # wheel is built and repaired: a failing test aborts the release.
      - run: cd py && python3 setup.py build_ext --inplace
      - run: cd py && python3 -m pytest -q
      - run: cd py && python3 -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Repair Wheel
        shell: bash
        run: |
          set -eu
          case "$RUNNER_OS" in
            Linux)   pip install auditwheel && auditwheel repair py/dist/*.whl -w dist/ ;;
            macOS)   pip install delocate   && delocate-wheel py/dist/*.whl -w dist/ ;;
            Windows) pip install delvewheel && delvewheel repair py/dist/*.whl -w dist/ ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2
        with:
          nim-version: '2.2.10'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: nimble install -y
      - run: pip install -U setuptools wheel Cython
      - run: nimble pySdist
      - name: Consume source distribution against this source checkout
        shell: bash
        run: |
          set -eu
          work="$RUNNER_TEMP/uniglyph-sdist"
          mkdir -p "$work"
          tar xzf py/dist/*.tar.gz -C "$work"
          UNIGLYPH_ROOT="$GITHUB_WORKSPACE" python -m pip wheel \
            --no-deps --no-build-isolation "$work"/uniglyph-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: py/dist/*.tar.gz

  publish:
    name: Publish
    needs: [test, cabi, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI
    needs: [test, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/uniglyph/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
