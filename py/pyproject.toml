[build-system]
requires = ["setuptools>=77", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uniglyph"
version = "1.0.0"
description = "Python binding for the UniGlyph C library (glyph/text engine)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["licenses/LICENSE", "licenses/NOTICE"]
authors = [{ name = "lbartoletti" }]
keywords = ["typography", "truetype", "text-layout", "glyph-atlas", "graphics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C",
  "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lituus-lab/UniGlyph"
Repository = "https://github.com/lituus-lab/UniGlyph"
Issues = "https://github.com/lituus-lab/UniGlyph/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["uniglyph"]
