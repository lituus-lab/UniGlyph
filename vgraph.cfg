# Dependency directions checked by `nimble checkVGraph`. See ADR-0001.

# Layers inside src/, lowest first. A module may import its own layer and any
# lower one, never a higher one. A name matches a file (common -> common.nim)
# or a directory (glyph -> glyph/*.nim). Modules under no listed layer are
# unconstrained: the umbrella module re-exports everything.
# Phase 1a layers: common < tables < font < glyph < layout < c_api.
#   common re-exports UniLinalg Vec2. tables parses OpenType tables. font wraps
#   tables + metrics. glyph builds a UniVector.Path per rune. layout places
#   glyphs single-line LTR. c_api imports the facade + UniImage + UniColor.
[layers]
c_api

# Uni* sibling engines this repo sits above in the family DAG. They are reached
# via --path in config.nims (untagged sibling-repo pattern), never `nimble
# requires`: any Uni* in `requires` is rejected as a back-edge. Non-Uni deps
# (nim, NimContracts) are external infra and go unchecked.
# UniGlyph sits above UniVector (+ UniImage, UniColor, UniLinalg) and is terminal.
[engines]
UniVector
UniImage
UniColor
UniLinalg