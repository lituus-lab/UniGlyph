# Dependency directions checked by `nimble checkVGraph`. See ADR-0001.

# Layers inside src/, lowest first. A module may import its own layer and any
# lower one, never a higher one. A name matches a file (common -> common.nim)
# or a directory (glyph -> glyph/*.nim). Modules under no listed layer are
# unconstrained: the umbrella module re-exports everything.
# Text layers: common < tables < font < glyph < shaping < layout < atlas <
# render < c_api.
[layers]
common
tables
font
glyph
shaping
layout
atlas
render
c_api

# Uni* engines this repo sits above in the family DAG. They must be declared as
# Nimble dependencies for isolated clones; this section is the allowlist that
# prevents an accidental upward or unrelated engine dependency.
# UniGlyph sits above UniVector (+ UniImage, UniColor, UniLinalg, UniCrypto)
# and below UniPlot.
[engines]
UniVector
UniImage
UniColor
UniLinalg
UniCrypto
